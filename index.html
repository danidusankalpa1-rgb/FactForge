<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactForge - Learning Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #ff0000; --dark-blue: #546e7a; --bg-gray: #f2f2f2; --white: #ffffff; }
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: var(--bg-gray); overflow-x: hidden; }
        header { background: #ededed; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .search-container { flex-grow: 1; margin: 0 15px; position: relative; }
        .search-container input { width: 100%; padding: 8px 35px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .search-container i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888; }
        .sidebar { position: fixed; left: -100%; top: 0; width: 280px; height: 100%; background: #ededed; transition: 0.3s; z-index: 2000; padding-top: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .sidebar.active { left: 0; }
        .menu-item { padding: 15px 20px; margin: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .section { display: none; padding: 15px; max-width: 500px; margin: auto; }
        .section.active { display: block; }
        .title-bar { background: var(--dark-blue); color: white; text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .card { background: var(--white); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .red-btn { background: var(--primary-red); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #notifPopup { display: none; position: fixed; top: 60px; right: 10px; width: 300px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1500; padding: 15px; }
        #videoOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>
    <header>
        <i class="fas fa-bars" onclick="toggleSidebar()"></i>
        <div class="search-container"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search..." onkeyup="search()"></div>
        <i class="fas fa-bell" onclick="toggleNotif()"></i>
    </header>

    <div class="sidebar" id="sidebar">
        <div class="menu-item" style="background:red;color:white" onclick="showSection('dashboard')">Dash bord</div>
        <div class="menu-item" style="background:black;color:white" onclick="showSection('videos')">All videos</div>
        <div class="menu-item" style="background:black;color:white" onclick="showSection('notes')">All notes</div>
        <div class="menu-item" style="background:black;color:white;position:absolute;bottom:20px;width:220px" onclick="showSection('about')">About Us</div>
    </div>

    <div id="notifPopup"><strong>Notifications</strong><hr><div id="notifList"></div></div>

    <div id="dashboard" class="section active">
        <div class="title-bar">Home</div>
        <div class="card" style="text-align:center">
            <img src="logo.jpg" style="width:100px;border-radius:15px;background:black">
            <h2>Welcome !</h2>
            <p>Website developed by Danidu Sankalpa<br>FactForge Admin : Danidu Sankalpa</p>
        </div>
        <button class="red-btn" style="margin-bottom:10px" onclick="showSection('videos')">Videos</button>
        <button class="red-btn" onclick="showSection('notes')">Notes</button>
    </div>

    <div id="videos" class="section"><div class="title-bar">All Videos</div><div id="vList"></div></div>
    <div id="notes" class="section"><div class="title-bar">All Notes</div><div id="nList"></div></div>
    <div id="about" class="section"><div class="title-bar">About Us</div><div class="card" style="text-align:center"><h2>FactForge</h2><p>Contact: +94753443030</p></div></div>

    <div id="videoOverlay"><button onclick="closeVideo()" style="color:white;align-self:flex-end;font-size:40px;background:none;border:none">&times;</button><div id="player"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnv4y9sdTs20pc-ppc4CuxbRcPZacBXI8",
            authDomain: "factforge-ece11.firebaseapp.com",
            projectId: "factforge-ece11",
            storageBucket: "factforge-ece11.firebasestorage.app",
            messagingSenderId: "301436944758",
            appId: "1:301436944758:web:547042aca0cf178e61ba57"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('active');
        window.toggleNotif = () => { const p = document.getElementById('notifPopup'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
        window.showSection = (id) => { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); toggleSidebar(); };

        onSnapshot(query(collection(db, "videos"), orderBy("timestamp", "desc")), (s) => {
            let h = ''; s.forEach(d => {
                const data = d.data(); const id = data.url.split('v=')[1]?.split('&')[0] || data.url.split('/').pop();
                h += `<div class="card video-card" data-title="${data.title.toLowerCase()}"><h3>${data.title}</h3><hr><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" style="width:100%"><button class="red-btn" onclick="playVideo('${id}')">Watch video</button></div>`;
            }); document.getElementById('vList').innerHTML = h;
        });

        onSnapshot(query(collection(db, "notes"), orderBy("timestamp", "desc")), (s) => {
            let h = ''; s.forEach(d => {
                const data = d.data(); const lines = data.text.split('\n');
                h += `<div class="card note-card" data-title="${data.title.toLowerCase()}"><h3>${data.title}</h3><hr><p id="t-${d.id}">${lines.slice(0,7).join('\n')}</p>${lines.length > 7 ? `<button class="red-btn" onclick="expand('${d.id}',\`${data.text.replace(/`/g,'\\`')}\`)">Open full note</button>`:'' }</div>`;
            }); document.getElementById('nList').innerHTML = h;
        });

        onSnapshot(query(collection(db, "notifications"), orderBy("timestamp", "desc")), (s) => {
            let h = ''; const now = Date.now();
            s.forEach(d => { if(now - d.data().timestamp < 5*24*60*60*1000) h += `<div style="margin-bottom:10px"><b>${d.data().message}</b><br><small>${new Date(d.data().timestamp).toLocaleDateString()}</small></div><hr>`; });
            document.getElementById('notifList').innerHTML = h || 'No notifications';
        });

        let player;
        window.playVideo = (id) => { document.getElementById('videoOverlay').style.display='flex'; if(player) player.loadVideoById(id); else player = new YT.Player('player', {height:'360', width:'100%', videoId:id}); };
        window.closeVideo = () => { document.getElementById('videoOverlay').style.display='none'; player.stopVideo(); };
        window.expand = (id, txt) => { document.getElementById('t-'+id).innerText = txt; event.target.style.display='none'; };
        window.search = () => { let v = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.video-card, .note-card').forEach(c => c.style.display = c.dataset.title.includes(v) ? 'block' : 'none'); };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
